name: Docker Publish

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate image tag
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Laravel
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/jozvancode/booking-platform-api:latest
            ghcr.io/jozvancode/booking-platform-api:${{ steps.version.outputs.tag }}

      - name: Build and push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.nginx
          push: true
          tags: |
            ghcr.io/jozvancode/booking-platform-nginx:latest
            ghcr.io/jozvancode/booking-platform-nginx:${{ steps.version.outputs.tag }}
