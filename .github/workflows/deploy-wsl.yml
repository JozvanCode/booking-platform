name: Deploy WSL

on:
  workflow_run:
    workflows: ["Docker Publish"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Booking API

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'workflow_run'
      }}

    runs-on: [self-hosted, Linux, X64, booking-deploy]
    environment: local-wsl
    timeout-minutes: 15

    concurrency:
      group: booking-wsl-deploy
      cancel-in-progress: false

    steps:
      - name: Generate image tag
        id: version
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="${COMMIT_SHA:0:7}"
          [[ "$TAG" =~ ^[0-9a-f]{7}$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy Booking API
        shell: bash
        working-directory: /home/jozefsolymosy/projects/booking-platform/backend
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
          DOCKER_CONFIG: /home/jozefsolymosy/.docker-deploy
        run: |
          ./deploy.sh "$IMAGE_TAG"

      - name: Verify API
        shell: bash
        run: |
          curl --fail --silent --show-error \
            http://localhost:8003/api/health
